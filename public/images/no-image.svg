<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric background lines -->
  <circle cx="400" cy="220" r="160" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="220" r="120" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.6"/>

  <!-- Center Card Container -->
  <g filter="url(#shadow)">
    <rect x="330" y="150" width="140" height="140" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Photo / Image Camera Icon -->
  <g transform="translate(370, 190)" stroke="url(#iconGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera body -->
    <path d="M2 13a4 4 0 0 1 4-4h7l3-5h18l3 5h7a4 4 0 0 1 4 4v26a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V13z" />
    <!-- Lens -->
    <circle cx="30" cy="26" r="10" />
    <circle cx="30" cy="26" r="4" fill="#94A3B8" opacity="0.3"/>
    <!-- Small flash -->
    <circle cx="46" cy="15" r="1.5" fill="#94A3B8"/>
  </g>

  <!-- Text: No Cover Image -->
  <text x="400" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#475569" letter-spacing="0.5">
    Belum Ada Cover Project
  </text>
  <text x="400" y="355" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
    Foto cover utama belum diunggah
  </text>
</svg>
